<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dina Safidy · portfolio</title>
  <!-- Bootstrap CSS (offline friendly) + Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f8fafc 0%, #e9eff5 100%);
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* main card – soft & modern */
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 2.5rem;
      box-shadow: 0 25px 45px -12px rgba(0, 20, 30, 0.25), 
                  0 4px 12px rgba(0, 0, 0, 0.05);
      transition: transform 0.25s ease, box-shadow 0.3s ease;
      max-width: 900px;
      width: 100%;
      overflow: hidden;
    }

    .glass-card:hover {
      transform: scale(1.01);
      box-shadow: 0 30px 55px -10px rgba(0, 35, 45, 0.3);
    }

    /* left image column */
    .profile-img-wrapper {
      background: #dbeafe50;
      padding: 2rem 1rem 2rem 1rem;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 2rem 0 0 2rem;
      backdrop-filter: blur(2px);
    }

    .profile-img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid white;
      box-shadow: 0 18px 25px -10px rgba(0,40,60,0.3);
      background: #f1f5f9;
      transition: all 0.2s;
    }

    /* right info area */
    .info-section {
      padding: 2rem 2rem 1rem 1.5rem;  /* reduced bottom padding for footer */
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(2px);
      border-radius: 0 2rem 0 0;
    }

    .name-title {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0a2a44;
      border-bottom: 3px solid #9bb8e0;
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
      line-height: 1.2;
    }

    .info-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .info-list li {
      display: flex;
      align-items: flex-start;
      gap: 0.9rem;
      padding: 0.7rem 0.9rem;
      margin-bottom: 0.6rem;
      background: rgba(255,255,255,0.6);
      border-radius: 60px;
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      font-size: 1.1rem;
      color: #153e5c;
      transition: background 0.15s;
    }

    .info-list li:hover {
      background: white;
      border-color: #b9d5f0;
    }

    .info-icon {
      font-size: 1.5rem;
      line-height: 1;
      min-width: 2rem;
      text-align: center;
      filter: drop-shadow(0 2px 2px rgba(0,30,50,0.1));
    }

    .info-text {
      flex: 1;
    }

    .info-text strong {
      font-weight: 600;
      color: #003057;
      margin-right: 0.5rem;
    }

    .skill-tag {
      display: inline-block;
      background: #d6e5f8;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #0b3b5a;
      margin-right: 0.6rem;
      margin-top: 0.2rem;
      border: 1px solid white;
    }

    .lang-tag {
      background: #e1d7f5;
      color: #2d1b5a;
    }

    /* footer contact */
    .contact-footer {
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(2px);
      border-top: 2px dashed rgba(90,130,180,0.2);
      padding: 1rem 1rem 1.2rem;
      text-align: center;
      border-radius: 0 0 2rem 2rem;
    }

    .contact-footer .bio-line {
      font-size: 0.95rem;
      color: #3f5f7a;
      margin-bottom: 0.75rem;
      font-style: italic;
    }

    .contact-icons a {
      color: #2c4b6e;
      font-size: 2rem;
      margin: 0 1rem;
      transition: all 0.2s;
      display: inline-block;
    }

    .contact-icons a:hover {
      color: #0a2a44;
      transform: translateY(-3px);
      text-shadow: 0 5px 10px rgba(0,60,100,0.2);
    }

    /* responsive */
    @media (max-width: 767px) {
      .profile-img-wrapper {
        border-radius: 2rem 2rem 0 0;
        padding: 2.2rem 1rem 1.5rem 1rem;
      }
      .info-section {
        border-radius: 0;
        padding: 2rem 1.5rem 0.5rem 1.5rem;
      }
      .name-title {
        font-size: 2rem;
        text-align: center;
      }
      .info-list li {
        padding: 0.7rem 1rem;
      }
      .contact-footer {
        border-radius: 0 0 2rem 2rem;
      }
    }

    .img-note {
      font-size: 0.85rem;
      color: #4a6885;
      margin-top: 0.5rem;
      background: #ebf2fa;
      padding: 0.2rem 1rem;
      border-radius: 50px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div class="container px-0">
  <div class="glass-card">
    <!-- row principale (image + infos) -->
    <div class="row g-0">
      <!-- LEFT COLUMN : profile image -->
      <div class="col-md-5 col-lg-4 d-flex align-items-stretch">
        <div class="profile-img-wrapper w-100">
          <img 
            class="profile-img" 
            src="Dina.jpeg"
            alt="HERINIAINA Dina Safidy"
          >
          <div class="img-note mt-3 text-center">
            <!-- libre pour commentaire éventuel -->
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN : personal details & skills -->
      <div class="col-md-7 col-lg-8">
        <div class="info-section">
          <h1 class="name-title">HERINIAINA Dina Safidy</h1>

          <ul class="info-list">
            <li>
              <span class="info-icon">📅</span>
              <span class="info-text"><strong>Date de naissance</strong> 31 Août 2006</span>
            </li>
            <li>
              <span class="info-icon">📍</span>
              <span class="info-text"><strong>Adresse</strong> IGAGA Tanambao</span>
            </li>
            <li>
              <span class="info-icon">🎓</span>
              <span class="info-text"><strong>Diplôme</strong> Baccalauréat série D, Année 2025</span>
            </li>
            <li>
              <span class="info-icon">💻</span>
              <span class="info-text"><strong>Informatique</strong> 
                <span class="skill-tag">Bureautique</span>
              </span>
            </li>
            <li>
              <span class="info-icon">🗣️</span>
              <span class="info-text"><strong>Langues</strong> 
                <span class="skill-tag lang-tag">Anglais</span>
                <span class="skill-tag lang-tag">Français</span>
              </span>
            </li>
          </ul>
          <!-- espace : le footer viendra après, ligne de présentation déplacée dans le footer -->
        </div>
      </div>
    </div>

    <!-- FOOTER CONTACT (WhatsApp, Facebook, mail) + petite bio -->
    <div class="contact-footer">
      <div class="bio-line">
        · passionné par l'organisation · disponible
      </div>
      <div class="contact-icons">
        <a href="#" target="_blank" title="WhatsApp"><i class="bi bi-whatsapp"></i></a>
        <a href="#" target="_blank" title="Facebook"><i class="bi bi-facebook"></i></a>
        <a href="#" target="_blank" title="Email"><i class="bi bi-envelope-fill"></i></a>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS bundle (facultatif) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>

<!-- petit script console -->
<script>
  (function() {
    console.log('✨ portfolio avec contact icons — prêt !');
  })();
</script>

<!-- 
  Le footer contient les logos WhatsApp, Facebook et Email.
  La carte est bien centrée dans la fenêtre.
  L'image tag <img> est toujours présente, vous pouvez remplacer src.
-->
</body>
</html>
